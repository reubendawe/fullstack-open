<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>MDN HTML &amp; CSS Basics - Experimentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <style>

    /* Css */

    * {
    background-color: cyan;
    }

    html {
    font-size: 10px;
    font-family: Roboto, sans-serif;
    }

    body {
    width: 600px;
    margin: 0 auto;
    background-color: #ff9500;
    padding: 20px 20px 20px 20px;
    border: 5px solid black;
    }

    h1 {
    font-size: 60px;
    text-align: center;
    }

    p, li {
    font-size: 16px;
    line-height: 2;
    letter-spacing: 1px;
    }

    p {
    font-family: sans-serif;
    background-color: black;
    color: cyan;
    }

    li {
    background-color: black;
    color: pink;
    border: 1px solid pink;
    margin-bottom: 5px;
    }

    img {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    }

    </style>
  </head>
  <body>

    <!-- https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Your_first_website/Creating_the_content -->

    <h1>Instructions for life:</h1>

    <ul>
      <li>Eat</li>
      <li>Sleep</li>
      <li>Repeat</li>
    </ul>

    <img src="https://picsum.photos/200/300" alt="A sample image from the Lorem Picsum site">

    <h1>Click here...</h1>
    <p>...to access <a href="https://www.google.com/">Google</a></p>

  </body>
</html>

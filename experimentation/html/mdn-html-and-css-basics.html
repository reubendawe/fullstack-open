<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>MDN HTML &amp; CSS Basics - Experimentation</title>
    <style>

    * {
    background-color: cyan;
    }

    p {
    font-family: sans-serif;
    background-color: black;
    color: cyan;
    }

    li {
    background-color: black;
    color: pink;
    border: 1px solid pink;
    margin-bottom: 5px;
    }

    </style>
  </head>
  <body>

    <!-- https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Your_first_website/Creating_the_content -->

    <p>Instructions for life:</p>

    <ul>
      <li>Eat</li>
      <li>Sleep</li>
      <li>Repeat</li>
    </ul>

    <img src="https://picsum.photos/200/300" alt="A sample image from the Lorem Picsum site">

    <h1>Click here...</h1>
    <p>...to access <a href="https://www.google.com/">Google</a></p>

  </body>
</html>
